[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revenew"
version = "0.1.0"
description = "A decision layer above Razorpay that finds where a merchant's revenue is leaking, takes one bounded commercial action, and proves whether it worked."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "scipy>=1.14",
    "numpy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Groq, not Anthropic -- SYSTEM_DESIGN.md section 3.1 names Claude, but no
# Anthropic billing was available in this environment. See
# revenew/settings.py and revenew/decide/generator.py for the disclosed swap.
llm = ["groq>=1.7"]
razorpay = ["razorpay>=1.4", "httpx>=0.28"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
revenew = "revenew.cli:main"

[tool.setuptools]
# `harness` ships alongside `revenew` because the CLI's `demo` and `replay`
# subcommands drive it, and a console-script entry point does NOT put the
# current directory on sys.path the way `python -m` does -- without this,
# `revenew demo` dies with ModuleNotFoundError on a machine where it was
# installed rather than run from a checkout. This does not weaken the
# isolation claim in db/schema.sql: that claim is that the RUNTIME decision
# path never opens harness.db, and it still doesn't. Only the two explicitly
# evaluation-shaped subcommands import harness, lazily, inside the function
# body -- see revenew/cli.py.
packages = ["revenew", "revenew.detect", "revenew.route", "revenew.decide",
            "revenew.execute", "revenew.ledger", "revenew.measure", "revenew.api",
            "revenew.agent", "harness"]

[tool.setuptools.package-data]
# `api/static/**` is the built React console (source in frontend/). It is
# committed and packaged for the same reason the LLM cassettes are: the
# README promises that a clone runs with pip alone, and requiring a node
# toolchain to see the dashboard would break that promise for anyone
# evaluating this project.
revenew = ["*.sql", "detect/*.sql", "decide/*.sql", "api/templates/*.html",
           "api/static/*", "api/static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in an argument default is FastAPI's dependency-injection
# pattern, not the mutable-default-argument bug B008 exists to catch -- every
# route in this file uses it and will keep using it.
"revenew/api/*.py" = ["B008"]
