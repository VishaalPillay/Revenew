version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: paydger_db
    environment:
      POSTGRES_USER: paydger
      POSTGRES_PASSWORD: paydger_password
      POSTGRES_DB: paydger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paydger -d paydger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: paydger_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://paydger:paydger_password@db:5432/paydger

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: paydger_web
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  postgres_data:
